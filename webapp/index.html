<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>Metaverse Sherpa | Institutional-Grade AI Trading</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Tailwind CSS (compiled) -->
    <link href="output.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f131f;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .glass-card {
            background: rgba(27, 31, 44, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .cyan-glow {
            box-shadow: 0 -2px 10px rgba(60, 215, 255, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(60, 215, 255, 0.5);
        }
        .gold-glow {
            box-shadow: 0 -2px 10px rgba(255, 219, 60, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 219, 60, 0.5);
        }
        .cyan-glow-focus:focus {
            outline: none;
            border-color: #3cd7ff;
            box-shadow: 0 0 12px rgba(60, 215, 255, 0.3);
        }
        .neon-button-glow {
            box-shadow: 0 0 15px rgba(60, 215, 255, 0.4);
        }
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .content-layer {
            position: relative;
            z-index: 10;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
        .animate-shimmer {
            animation: shimmer 1.5s infinite;
        }
        
        /* Premium Loading Overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, backdrop-filter 0.4s ease;
        }
        #loading-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .loading-card {
            background: rgba(27, 31, 44, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 290px;
            text-align: center;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .loading-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #3cd7ff, #00e676, #3cd7ff);
            background-size: 200% auto;
            animation: loading-gradient-shift 3s linear infinite;
        }
        @keyframes loading-gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .spinner-ring {
            position: relative;
            width: 56px;
            height: 56px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spinner-circle {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top-color: #3cd7ff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-icon {
            font-size: 24px !important;
            color: #3cd7ff;
            animation: pulse-glow 1.6s ease-in-out infinite alternate;
        }
        @keyframes pulse-glow {
            from { transform: scale(0.9); opacity: 0.6; }
            to { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 8px rgba(60, 215, 255, 0.6)); }
        }
        .loading-btn {
            margin-top: 24px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .loading-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }
        @keyframes reveal-log {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    
    
</head>
<body class="bg-background text-on-surface min-h-screen">
    <!-- Starfield Background Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Beautiful Glassmorphic Loader Overlay -->
    <div id="loading-overlay">
        <div class="loading-card">
            <div class="spinner-ring">
                <div class="spinner-circle"></div>
                <span class="material-symbols-outlined loading-icon">landscape</span>
            </div>
            <h3 id="loading-title" style="color: #ffffff; font-size: 15px; font-weight: 700; margin: 0 0 4px 0;">Connecting to Google</h3>
            <p id="loading-subtitle" style="color: rgba(255, 255, 255, 0.6); font-size: 11px; margin: 0; line-height: 1.5;">Please select your Google account in the popup window.</p>
            <button id="cancel-loading-btn" onclick="window.hideGoogleLoading()" class="loading-btn">
                <span class="material-symbols-outlined" style="font-size: 14px;">close</span>
                Cancel
            </button>
        </div>
    </div>

    <!-- Unified App Shell Slot -->
    <div id="app" class="content-layer min-h-screen flex flex-col justify-between"></div>

    <!-- Active Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Firebase SDK (Compatibility version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Single Page Application Logic Script -->
    <script src="app.js?v=1.0.17"></script>
</body>
</html>
