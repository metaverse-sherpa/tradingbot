<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>Metaverse Sherpa | Institutional-Grade AI Trading</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Tailwind CSS (compiled) -->
    <link href="output.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f131f;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .glass-card {
            background: rgba(27, 31, 44, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .cyan-glow {
            box-shadow: 0 -2px 10px rgba(60, 215, 255, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(60, 215, 255, 0.5);
        }
        .gold-glow {
            box-shadow: 0 -2px 10px rgba(255, 219, 60, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 219, 60, 0.5);
        }
        .cyan-glow-focus:focus {
            outline: none;
            border-color: #3cd7ff;
            box-shadow: 0 0 12px rgba(60, 215, 255, 0.3);
        }
        .neon-button-glow {
            box-shadow: 0 0 15px rgba(60, 215, 255, 0.4);
        }
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .content-layer {
            position: relative;
            z-index: 10;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
        .animate-shimmer {
            animation: shimmer 1.5s infinite;
        }
    </style>
    
    
</head>
<body class="bg-background text-on-surface min-h-screen">
    <!-- Starfield Background Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Unified App Shell Slot -->
    <div id="app" class="content-layer min-h-screen flex flex-col justify-between"></div>

    <!-- Active Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Single Page Application Logic Script -->
    <script src="app.js?v=1.0.7"></script>
</body>
</html>
