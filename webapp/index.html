<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>Metaverse Sherpa | Institutional-Grade AI Trading</title>
    <!-- Tailwind CSS (with Forms and Container Queries plugins) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f131f;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .glass-card {
            background: rgba(27, 31, 44, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .cyan-glow {
            box-shadow: 0 -2px 10px rgba(60, 215, 255, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(60, 215, 255, 0.5);
        }
        .gold-glow {
            box-shadow: 0 -2px 10px rgba(255, 219, 60, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 219, 60, 0.5);
        }
        .cyan-glow-focus:focus {
            outline: none;
            border-color: #3cd7ff;
            box-shadow: 0 0 12px rgba(60, 215, 255, 0.3);
        }
        .neon-button-glow {
            box-shadow: 0 0 15px rgba(60, 215, 255, 0.4);
        }
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .content-layer {
            position: relative;
            z-index: 10;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#262a37",
                        "tertiary-fixed-dim": "#00e479",
                        "on-tertiary-container": "#005d2d",
                        "primary-container": "#00d4ff",
                        "error-container": "#93000a",
                        "surface-container-lowest": "#0a0e1a",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#3c494e",
                        "tertiary-container": "#00df76",
                        "on-surface-variant": "#bbc9cf",
                        "on-surface": "#dfe2f3",
                        "surface-container-low": "#171b28",
                        "tertiary-fixed": "#60ff99",
                        "outline": "#859398",
                        "on-primary-fixed-variant": "#004e5f",
                        "on-primary-fixed": "#001f27",
                        "surface-tint": "#3cd7ff",
                        "on-background": "#dfe2f3",
                        "surface-variant": "#313442",
                        "on-tertiary": "#003919",
                        "on-error": "#690005",
                        "surface-container-highest": "#313442",
                        "surface-container": "#1b1f2c",
                        "tertiary": "#00ff88",
                        "primary-fixed": "#b4ebff",
                        "on-tertiary-fixed": "#00210c",
                        "secondary-container": "#ffdb3c",
                        "inverse-on-surface": "#2c303d",
                        "on-primary": "#003642",
                        "secondary": "#fff9ef",
                        "error": "#ffb4ab",
                        "inverse-primary": "#00677e",
                        "on-secondary": "#3a3000",
                        "surface-bright": "#353946",
                        "primary-fixed-dim": "#3cd7ff",
                        "surface-dim": "#0f131f",
                        "surface": "#0f131f",
                        "background": "#0f131f",
                        "on-secondary-fixed-variant": "#544600",
                        "primary": "#a8e8ff",
                        "secondary-fixed-dim": "#e9c400",
                        "on-secondary-container": "#725f00",
                        "secondary-fixed": "#ffe16d",
                        "on-primary-container": "#00586b",
                        "on-tertiary-fixed-variant": "#005228",
                        "inverse-surface": "#dfe2f3",
                        "on-secondary-fixed": "#221b00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "24px",
                        "stack-gap": "12px",
                        "inline-gap": "8px",
                        "card-padding": "16px",
                        "container-margin": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "numeric-data": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "numeric-data": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                        "label-sm": ["10px", {"lineHeight": "12px", "letterSpacing": "0.08em", "fontWeight": "600"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-surface min-h-screen">
    <!-- Starfield Background Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Unified App Shell Slot -->
    <div id="app" class="content-layer min-h-screen flex flex-col justify-between"></div>

    <!-- Active Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Single Page Application Logic Script -->
    <script src="app.js"></script>
</body>
</html>
