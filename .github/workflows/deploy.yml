name: Deploy to VPS

on:
  push:
    branches:
      - main  # Trigger on pushes to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Institutional Deploy via SSH to GCP
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🕵️‍♂️ Starting Institutional Deployment..."
            cd /home/gilesasp/tradingbot
            
            echo "📥 Fetching latest code..."
            git pull origin main
            
            echo "🔄 Restarting Sherpa Engine..."
            sudo systemctl restart tradingbot
            
            echo "✅ Deployment Successful. Verification marker: 2026-05-14 10:02"
