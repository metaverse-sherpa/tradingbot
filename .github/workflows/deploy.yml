name: Deploy to VPS

on:
  push:
    branches:
      - main  # Trigger on pushes to main
  workflow_dispatch:  # Allow manual triggering from the UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Institutional Deploy via SSH to GCP
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            echo "🕵️‍♂️ Starting Institutional Deployment..."
            cd /home/gilesasp/tradingbot
            
            echo "📥 Synchronizing with GitHub HEAD (Hard Reset)..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Installing updated dependencies..."
            /home/gilesasp/tradingbot/venv/bin/pip install -r requirements.txt
            
            echo "🏗️ Building React Frontend..."
            cd /home/gilesasp/tradingbot/webapp-react
            npm install
            npm run build
            cd /home/gilesasp/tradingbot
            
            echo "⚙️ Applying NGINX configuration..."
            bash update_nginx.sh
            
            echo "🔄 Enabling autostart for backend services..."
            sudo systemctl enable webapi
            sudo systemctl enable tradingbot
            
            echo "🔄 Gracefully reloading Sherpa Web API..."
            sudo systemctl reload webapi

            echo "🔄 Restarting Sherpa Trading Bot..."
            sudo systemctl restart tradingbot
            
            
            echo "✅ Deployment Successful."
