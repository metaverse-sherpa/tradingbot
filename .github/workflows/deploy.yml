name: Deploy to VPS

on:
  push:
    branches:
      - main  # Trigger on pushes to main
  workflow_dispatch:  # Allow manual triggering from the UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'webapp-react/**'
            deps:
              - 'requirements.txt'
            backend:
              - 'bot/**'
              - 'web_api/**'
              - '*.py'
              - 'requirements.txt'

      - name: Setup Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Frontend
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd webapp-react
          npm install
          npm run build

      - name: Copy frontend dist to VPS
        if: steps.filter.outputs.frontend == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "webapp-react/dist/*"
          target: "/home/gilesasp/tradingbot/webapp-react/dist"
          strip_components: 2

      - name: Institutional Deploy via SSH to GCP
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            echo "🕵️‍♂️ Starting Institutional Deployment..."
            cd /home/gilesasp/tradingbot
            
            echo "🔧 Fixing repository permissions..."
            sudo chown -R gilesasp:gilesasp /home/gilesasp/tradingbot
            
            echo "📥 Synchronizing with GitHub HEAD (Hard Reset)..."
            git fetch origin main
            git reset --hard origin/main
            
            if [ "${{ steps.filter.outputs.deps }}" == "true" ]; then
              echo "📦 Installing updated dependencies..."
              /home/gilesasp/tradingbot/venv/bin/pip install -r requirements.txt
            fi
            
            if [ "${{ steps.filter.outputs.backend }}" == "true" ]; then
              echo "🔄 Restarting backend services..."
              sudo systemctl restart webapi
              sudo systemctl restart tradingbot
            fi
            
            echo "✅ Deployment Successful."
