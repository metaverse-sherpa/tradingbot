name: Deploy to VPS

on:
  push:
    branches:
      - main  # Trigger on pushes to main
  workflow_dispatch:  # Allow manual triggering from the UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Institutional Deploy via SSH to GCP
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            echo "🕵️‍♂️ Starting Institutional Deployment..."
            cd /home/gilesasp/tradingbot
            
            echo "📥 Synchronizing with GitHub HEAD (Hard Reset)..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🔄 Restarting Sherpa Engine..."
            sudo systemctl restart tradingbot
            sudo systemctl restart webapi
            
            echo "✅ Deployment Successful. Verification marker: 2026-05-14 10:02"
